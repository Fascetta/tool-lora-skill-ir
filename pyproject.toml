[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-lora-skill-ir"
version = "1.0.0"
description = "Persistent relational skill representations for tool-using language models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Christian Bianchi"}]
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
test = ["pytest>=8.0"]
peft = ["safetensors>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = [".", "src"]
